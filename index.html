<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Earth</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            min-height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        #stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        #canvas {
            display: block;
            position: relative;
            z-index: 1;
        }

        h1 {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff69b4;
            z-index: 2;
            font-size: 32px;
        }

        .controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff69b4;
            text-align: center;
            font-size: 14px;
            z-index: 2;
        }
    </style>
</head>
<body>
    <svg id="stars" xmlns="http://www.w3.org/2000/svg"></svg>
    <h1>Hello World</h1>
    <canvas id="canvas"></canvas>
    <div class="controls">
        <p>Drag to rotate the globe</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Create stars
        const svg = document.getElementById('stars');
        const w = window.innerWidth, h = window.innerHeight;
        svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
        for (let i = 0; i < 200; i++) {
            const x = Math.random() * w;
            const y = Math.random() * h;
            const r = Math.random() * 1.2 + 0.3;
            const op = (Math.random() * 0.6 + 0.3).toFixed(2);
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', x);
            circle.setAttribute('cy', y);
            circle.setAttribute('r', r);
            circle.setAttribute('fill', 'white');
            circle.setAttribute('opacity', op);
            svg.appendChild(circle);
        }

        // Three.js setup
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000);
        camera.position.z = 2.5;

        // Create canvas texture for Earth with realistic colors
        const textureCanvas = document.createElement('canvas');
        textureCanvas.width = 2048;
        textureCanvas.height = 1024;
        const ctx = textureCanvas.getContext('2d');

        // Ocean base
        ctx.fillStyle = '#1a4d7a';
        ctx.fillRect(0, 0, textureCanvas.width, textureCanvas.height);

        // Add ocean depth variation
        for (let i = 0; i < 500; i++) {
            ctx.fillStyle = `rgba(26, 77, 122, ${Math.random() * 0.15})`;
            ctx.fillRect(
                Math.random() * textureCanvas.width,
                Math.random() * textureCanvas.height,
                Math.random() * 100,
                Math.random() * 100
            );
        }

        // Land colors
        const landColor = '#2d5a3d';
        const desertColor = '#c4a747';

        ctx.fillStyle = landColor;

        // Helper to draw continent with better shapes
        function drawContinent(startX, startY, points) {
            ctx.beginPath();
            ctx.moveTo(startX + points[0][0], startY + points[0][1]);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(startX + points[i][0], startY + points[i][1]);
            }
            ctx.closePath();
            ctx.fill();
        }

        // North America
        drawContinent(80, 280, [[0, 0], [50, -40], [100, -30], [120, 30], [100, 100], [40, 90], [10, 60]]);

        // South America
        drawContinent(140, 450, [[0, 0], [50, -30], [65, 20], [55, 150], [15, 160], [-5, 100]]);

        // Europe/Africa
        drawContinent(380, 250, [[0, 0], [80, -50], [100, 30], [90, 150], [40, 180], [10, 120], [-5, 50]]);

        // Sahara Desert
        ctx.fillStyle = desertColor;
        drawContinent(420, 320, [[0, 0], [60, -20], [70, 50], [50, 80], [10, 70]]);
        ctx.fillStyle = landColor;

        // Asia
        drawContinent(520, 180, [[0, 0], [180, -60], [230, 60], [180, 160], [80, 150], [40, 80]]);

        // India
        ctx.fillStyle = landColor;
        drawContinent(680, 300, [[0, 0], [35, -15], [40, 60], [15, 70]]);

        // Southeast Asia
        drawContinent(750, 320, [[0, 0], [60, -25], [75, 45], [35, 60]]);

        // Australia
        drawContinent(840, 400, [[0, 0], [70, -50], [90, 20], [85, 120], [40, 130], [0, 80]]);

        // Back side - East Asia
        drawContinent(1350, 260, [[0, 0], [50, -35], [65, 25], [50, 65]]);
        drawContinent(1500, 200, [[0, 0], [100, -50], [130, 50], [85, 120]]);

        // Greenland hint
        ctx.fillStyle = '#b8d4e8';
        drawContinent(200, 180, [[0, 0], [40, -30], [45, 20], [20, 35]]);

        // Antarctica
        ctx.fillStyle = '#e8e8e8';
        ctx.globalAlpha = 0.7;
        drawContinent(350, 900, [[0, 0], [200, -20], [300, 0], [350, 30], [200, 80], [0, 70]]);
        ctx.globalAlpha = 1;

        const texture = new THREE.CanvasTexture(textureCanvas);
        const geometry = new THREE.SphereGeometry(1, 128, 128);
        const material = new THREE.MeshPhongMaterial({
            map: texture,
            shininess: 8,
            emissive: 0x1a1a1a
        });
        const globe = new THREE.Mesh(geometry, material);
        globe.castShadow = true;
        globe.receiveShadow = true;
        scene.add(globe);

        // Add subtle atmosphere effect
        const atmosphereGeometry = new THREE.SphereGeometry(1.02, 128, 128);
        const atmosphereMaterial = new THREE.MeshPhongMaterial({
            color: 0x87ceeb,
            transparent: true,
            opacity: 0.1,
            side: THREE.BackSide
        });
        const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        scene.add(atmosphere);

        // Lighting - more realistic
        const light1 = new THREE.DirectionalLight(0xffffff, 1.0);
        light1.position.set(8, 4, 8);
        light1.castShadow = true;
        scene.add(light1);

        const light2 = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(light2);

        // Interaction with momentum
        let isDragging = false;
        let lastX = 0;
        let lastY = 0;
        let rotationX = 0;
        let rotationY = 0;
        let velocityX = 0;
        let velocityY = 0;
        const friction = 0.98; // Higher = slower deceleration
        const maxVelocity = 1.2;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
            velocityX = 0;
            velocityY = 0;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - lastX;
            const dy = e.clientY - lastY;
            rotationY += dx * 0.01;
            rotationX += dy * 0.01;

            // Capture velocity for momentum
            velocityY = (dx * 0.01) / 0.016; // Normalize to frame-time
            velocityX = (dy * 0.01) / 0.016;

            // Clamp velocity
            velocityX = Math.max(-maxVelocity, Math.min(maxVelocity, velocityX));
            velocityY = Math.max(-maxVelocity, Math.min(maxVelocity, velocityY));

            lastX = e.clientX;
            lastY = e.clientY;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
            velocityX = 0;
            velocityY = 0;
        });

        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const dx = e.touches[0].clientX - lastX;
            const dy = e.touches[0].clientY - lastY;
            rotationY += dx * 0.01;
            rotationX += dy * 0.01;

            velocityY = (dx * 0.01) / 0.016;
            velocityX = (dy * 0.01) / 0.016;

            velocityX = Math.max(-maxVelocity, Math.min(maxVelocity, velocityX));
            velocityY = Math.max(-maxVelocity, Math.min(maxVelocity, velocityY));

            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
        });

        document.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Apply momentum when not dragging
            if (!isDragging) {
                rotationY += velocityY * 0.016;
                rotationX += velocityX * 0.016;

                // Apply friction
                velocityX *= friction;
                velocityY *= friction;

                // Stop very small velocities to prevent infinite spinning
                if (Math.abs(velocityX) < 0.00001) velocityX = 0;
                if (Math.abs(velocityY) < 0.00001) velocityY = 0;
            }

            globe.rotation.x = rotationX;
            globe.rotation.y = rotationY;
            renderer.render(scene, camera);
        }
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
