<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Earth</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            min-height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        #canvas {
            display: block;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            cursor: grab;
        }

        #canvas:active { cursor: grabbing; }

        h1 {
            position: fixed;
            top: 36px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.85);
            z-index: 2;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(100, 180, 255, 0.4);
            pointer-events: none;
        }

        .controls {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.45);
            text-align: center;
            font-size: 13px;
            z-index: 2;
            letter-spacing: 2px;
            pointer-events: none;
        }

        .loader {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            letter-spacing: 3px;
            z-index: 10;
            transition: opacity 0.8s;
        }

        .loader.hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div class="loader" id="loader">LOADING</div>
    <h1>Hello World</h1>
    <canvas id="canvas"></canvas>
    <div class="controls">Drag to rotate</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const loader = document.getElementById('loader');

        // Renderer
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        // Scene & Camera
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 3;

        // --- Stars ---
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 6000;
        const starsPos = new Float32Array(starsCount * 3);
        const starsSizes = new Float32Array(starsCount);
        for (let i = 0; i < starsCount; i++) {
            const r = 50 + Math.random() * 150;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            starsPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            starsPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            starsPos[i * 3 + 2] = r * Math.cos(phi);
            starsSizes[i] = Math.random() * 1.5 + 0.5;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        starsGeo.setAttribute('size', new THREE.BufferAttribute(starsSizes, 1));

        const starsMat = new THREE.ShaderMaterial({
            uniforms: { time: { value: 0 } },
            vertexShader: `
                attribute float size;
                varying float vSize;
                void main() {
                    vSize = size;
                    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * (200.0 / -mvPos.z);
                    gl_Position = projectionMatrix * mvPos;
                }
            `,
            fragmentShader: `
                varying float vSize;
                void main() {
                    float d = length(gl_PointCoord - vec2(0.5));
                    float alpha = 1.0 - smoothstep(0.0, 0.5, d);
                    gl_FragColor = vec4(1.0, 1.0, 1.0, alpha * 0.8);
                }
            `,
            transparent: true,
            depthWrite: false
        });
        scene.add(new THREE.Points(starsGeo, starsMat));

        // --- Texture loader ---
        const texLoader = new THREE.TextureLoader();
        const earthTexUrl = 'https://unpkg.com/three-globe@2.31.1/example/img/earth-blue-marble.jpg';
        const bumpTexUrl = 'https://unpkg.com/three-globe@2.31.1/example/img/earth-topology.png';
        const cloudTexUrl = 'https://unpkg.com/three-globe@2.24.4/example/img/earth-water.png';

        let loadCount = 0;
        function onLoad() {
            loadCount++;
            if (loadCount >= 2) {
                loader.classList.add('hidden');
            }
        }

        // --- Earth ---
        const earthGeo = new THREE.SphereGeometry(1, 128, 128);
        const earthTex = texLoader.load(earthTexUrl, onLoad);
        const bumpTex = texLoader.load(bumpTexUrl, onLoad);

        const earthMat = new THREE.MeshPhongMaterial({
            map: earthTex,
            bumpMap: bumpTex,
            bumpScale: 0.04,
            specularMap: bumpTex,
            specular: new THREE.Color(0x333333),
            shininess: 15,
        });
        const earth = new THREE.Mesh(earthGeo, earthMat);
        scene.add(earth);

        // --- Clouds ---
        const cloudGeo = new THREE.SphereGeometry(1.008, 128, 128);
        const cloudTex = texLoader.load(cloudTexUrl);
        const cloudMat = new THREE.MeshPhongMaterial({
            map: cloudTex,
            transparent: true,
            opacity: 0.25,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const clouds = new THREE.Mesh(cloudGeo, cloudMat);
        scene.add(clouds);

        // --- Atmosphere glow (Fresnel shader) ---
        const atmosGeo = new THREE.SphereGeometry(1.15, 64, 64);
        const atmosMat = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vPosition;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                varying vec3 vPosition;
                void main() {
                    vec3 viewDir = normalize(-vPosition);
                    float fresnel = 1.0 - dot(viewDir, vNormal);
                    fresnel = pow(fresnel, 3.0);
                    vec3 color = mix(vec3(0.3, 0.6, 1.0), vec3(0.1, 0.4, 0.9), fresnel);
                    gl_FragColor = vec4(color, fresnel * 0.7);
                }
            `,
            transparent: true,
            side: THREE.BackSide,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        scene.add(new THREE.Mesh(atmosGeo, atmosMat));

        // Inner glow ring
        const innerGlowGeo = new THREE.SphereGeometry(1.03, 64, 64);
        const innerGlowMat = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vPosition;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                varying vec3 vPosition;
                void main() {
                    vec3 viewDir = normalize(-vPosition);
                    float rim = 1.0 - dot(viewDir, vNormal);
                    rim = pow(rim, 4.0);
                    gl_FragColor = vec4(0.4, 0.7, 1.0, rim * 0.5);
                }
            `,
            transparent: true,
            side: THREE.FrontSide,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        scene.add(new THREE.Mesh(innerGlowGeo, innerGlowMat));

        // --- Lighting ---
        const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.8);
        sunLight.position.set(5, 2, 5);
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x4488cc, 0.3);
        fillLight.position.set(-5, -2, -3);
        scene.add(fillLight);

        const ambientLight = new THREE.AmbientLight(0x222244, 0.8);
        scene.add(ambientLight);

        // --- Interaction with momentum ---
        let isDragging = false;
        let lastX = 0, lastY = 0;
        let rotationX = 0.3; // Slight tilt
        let rotationY = 0;
        let velocityX = 0, velocityY = 0;
        const friction = 0.985;
        const maxVelocity = 1.5;

        function onPointerDown(x, y) {
            isDragging = true;
            lastX = x;
            lastY = y;
            velocityX = 0;
            velocityY = 0;
        }

        function onPointerMove(x, y) {
            if (!isDragging) return;
            const dx = x - lastX;
            const dy = y - lastY;
            rotationY += dx * 0.005;
            rotationX += dy * 0.005;
            velocityY = dx * 0.005;
            velocityX = dy * 0.005;
            velocityX = Math.max(-maxVelocity, Math.min(maxVelocity, velocityX));
            velocityY = Math.max(-maxVelocity, Math.min(maxVelocity, velocityY));
            lastX = x;
            lastY = y;
        }

        function onPointerUp() { isDragging = false; }

        canvas.addEventListener('mousedown', e => onPointerDown(e.clientX, e.clientY));
        document.addEventListener('mousemove', e => onPointerMove(e.clientX, e.clientY));
        document.addEventListener('mouseup', onPointerUp);

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });
        document.addEventListener('touchmove', e => {
            onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
        });
        document.addEventListener('touchend', onPointerUp);

        // --- Animation ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            if (!isDragging) {
                rotationY += velocityY;
                rotationX += velocityX;
                velocityX *= friction;
                velocityY *= friction;
                if (Math.abs(velocityX) < 0.00001) velocityX = 0;
                if (Math.abs(velocityY) < 0.00001) velocityY = 0;
            }

            // Clamp vertical rotation
            rotationX = Math.max(-1.2, Math.min(1.2, rotationX));

            earth.rotation.x = rotationX;
            earth.rotation.y = rotationY;

            clouds.rotation.x = rotationX;
            clouds.rotation.y = rotationY + elapsed * 0.01;

            renderer.render(scene, camera);
        }
        animate();

        // --- Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });
    </script>
</body>
</html>
